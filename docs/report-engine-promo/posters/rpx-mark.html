<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 400px; height: 400px; overflow: hidden; background: transparent; }
  .mark {
    width: 400px; height: 400px; border-radius: 96px; position: relative; overflow: hidden;
    background:
      radial-gradient(260px 200px at 70% 20%, rgba(56,189,248,.22), transparent 65%),
      linear-gradient(160deg, #0D1528 0%, #070C18 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: "Microsoft YaHei UI", "Microsoft YaHei", "Segoe UI", sans-serif;
  }
  .grid {
    position: absolute; inset: 0; opacity: .55;
    background-image:
      linear-gradient(rgba(148,163,184,.10) 1px, transparent 1px),
      linear-gradient(90deg, rgba(148,163,184,.10) 1px, transparent 1px);
    background-size: 50px 50px;
    mask-image: radial-gradient(circle at 50% 50%, #000 30%, transparent 76%);
  }
  .r {
    position: relative; font-size: 168px; line-height: 1; font-weight: 900; letter-spacing: -.02em;
    background: linear-gradient(160deg, #E0F2FE 0%, #7DD3FC 45%, #38BDF8 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .bar { position: relative; width: 150px; height: 5px; margin-top: 6px; border-radius: 9px;
    background: linear-gradient(90deg, rgba(56,189,248,0), #38BDF8, rgba(56,189,248,0)); }
  .sub { position: relative; margin-top: 12px; font-size: 21px; letter-spacing: .24em; color: #94A3B8; font-weight: 700; padding-left: .24em; }
</style>
</head>
<body>
  <div class="mark">
    <div class="grid"></div>
    <div class="r">AI</div>
    <div class="bar"></div>
    <div class="sub">REPORT ENGINE</div>
  </div>
</body>
</html>
