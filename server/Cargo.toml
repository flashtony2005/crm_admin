[package]
name = "cms-server"
version = "0.1.0"
edition = "2021"
description = "AI-Native Small Business CMS — Phase 1 backend (Axum + SeaORM/SQLite, Turso-ready)"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sea-orm = { version = "2.0", features = ["sqlx-sqlite", "runtime-tokio-native-tls", "macros"] }
jsonwebtoken = "9"
argon2 = { version = "0.5", features = ["std"] }
rand_core = { version = "0.6", features = ["getrandom"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# 全量商业层：GraphQL / 出站 Webhook 签名 / 真实 SMTP
async-graphql = { version = "7", features = ["chrono"] }
async-graphql-axum = "7"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "rustls-tls", "builder"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

[profile.dev]
opt-level = 0

[workspace]

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
